###############################################################################
# DreamOpenWRT — OpenWrt x86_64 自动构建
#
# 触发方式：
#   1. 手动 Run workflow（可覆盖源码 ref / 并行度）
#   2. 推送到 main 且改到构建相关内容（脚本 / 配置 / overlay / feeds）
#   3. 每周六 02:00（CST）定时重建，跟上 25.12 分支的安全更新
#   4. 打 fw-v* tag，构建完自动发 Release
#
# 缓存策略（Actions 缓存池是整仓共享的 10GB）：
#   dl/ 源码包  固定 key，约 2GB，写一次就够；只有下载阶段完整跑完才允许保存
#   ccache      每次 run 一个新 key + 前缀恢复，约 2~3GB；rules.mk 里已改成压缩存储
#
# 时间预算（GitHub 对公开/私有仓库是两张规格表）：
#   公开仓库 ubuntu-latest = 4 vCPU / 16GB，首次 2~3 小时
#   私有仓库 ubuntu-latest = 2 vCPU /  8GB，首次 3.5~4.5 小时
#   ccache 热了之后大约是首次的 1/3。
# 作业硬上限 360 分钟，这里把编译步骤卡在 300 分钟：即使超时也只判该步骤失败，
# 后面的存缓存、传日志照常执行，下一轮接着编，不会整轮白跑。
###############################################################################
name: Build OpenWrt x86_64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'OpenWrt 源码 ref（tag 或分支），留空用 v25.12.6'
        required: false
        default: ''
      jobs:
        description: '编译并行度，留空按 CPU 核心数'
        required: false
        default: ''

  schedule:
    - cron: '0 18 * * 5'

  push:
    branches:
      - main
    paths:
      - 'build-openwrt.sh'
      - 'config/**'
      - 'files/**'
      - 'feeds.conf'
      - '.github/workflows/build.yml'
    tags:
      - 'fw-v*'

permissions:
  contents: write
  # 清理 Actions 运行记录需要
  actions: write

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub 自己会设置 CI=true，脚本里用的是 CI_MODE，别混淆
  CI_MODE: '1'
  # 和 10GB 池的分配：ccache 3G x2 份 + dl 2G ≈ 8G
  CCACHE_MAXSIZE: 3G
  # actions/cache 的条目不可变，改这个值可以强制重建 dl 缓存
  DL_CACHE_EPOCH: v1

jobs:
  # 构建前先清一轮运行记录，避免堆到上百条再删。
  # 这个 job 的脚本设计成永不失败，所以后面可以直接 needs 它，不会因为清理出错挡住建固件。
  cleanup-before:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 清理旧运行记录（保留最近 8 条）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: '8'
        run: ./scripts/cleanup-runs.sh

  # 先花十几秒挡住语法错误，别为了一个错别字烧掉三小时机时
  lint:
    needs: cleanup-before
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检查构建脚本
        run: |
          bash -n build-openwrt.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error build-openwrt.sh

      - name: 检查配置文件
        run: |
          set -euo pipefail
          # .config 里同一个符号出现两次时，kconfig 只认最后一次，是静默踩坑的重灾区。
          # 字符集必须带连字符：CONFIG_PACKAGE_luci-app-firewall 这类名字里全是 -
          dupes="$(grep -oE '^#? ?CONFIG_[A-Za-z0-9_-]+' config/openwrt.config \
                   | sed 's/^#* //' | sort | uniq -d || true)"
          if [ -n "$dupes" ]; then
            echo "::error::config/openwrt.config 里有重复符号：$dupes"
            exit 1
          fi
          # overlay 里所有 json 都过一遍语法检查。用 find + xargs -r，
          # 现在 files/ 里没有 json 也不会判失败
          find files -name '*.json' -print0 \
            | xargs -0 -r python3 -c 'import json,sys;[json.load(open(p)) for p in sys.argv[1:]]'
          echo "配置文件检查通过"

      # 直接复刻 scripts/feeds 的 parse_file 逻辑来校验，而不是凭感觉写正则：
      # 它先 s/#.+$// 去注释，要求 # 后面至少一个字符，所以「只有 # 的一行」
      # 不会被当成注释，而是会被当配置行解析，然后 die "Syntax error"。
      # 本地没有 OpenWrt 源码树也跑不了 feeds 命令，只能这样离线挡住。
      - name: 检查 feeds.conf
        run: |
          set -euo pipefail
          python3 - feeds.conf <<'PY'
          import re
          import sys

          pat = re.compile(
              r"^src-([\w\-]+)((?:\s+--\w+(?:=\S+)?)*)\s+(\w+)(?:\s+(\S.*))?$",
              re.ASCII,
          )

          bad = 0
          with open(sys.argv[1], encoding="utf-8") as fh:
              for lineno, raw in enumerate(fh, 1):
                  line = re.sub(r"#.+$", "", raw.rstrip("\n"), flags=re.ASCII)
                  if not re.search(r"\S", line, re.ASCII):
                      continue
                  m = pat.match(line)
                  if not m or not m.group(1) or not m.group(3):
                      print(f"::error file=feeds.conf,line={lineno}::这行 feeds 解析不了：{line}")
                      bad += 1
          if bad:
              print("提示：只有 # 的行也会被当成配置行，注释里必须 # 后面带内容")
          sys.exit(1 if bad else 0)
          PY

      - name: 检查 overlay 脚本语法
        run: |
          set -euo pipefail
          for f in files/etc/uci-defaults/*; do
            [ -f "$f" ] || continue
            sh -n "$f"
            echo "sh -n 通过: $f"
          done

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        id: meta
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          echo "ref=${INPUT_REF:-v25.12.6}" >>"$GITHUB_OUTPUT"

          # 日期按北京时间取，否则 08:00 前的构建会标成前一天。
          # 用 POSIX 的 CST-8 而不是 Asia/Shanghai：前者不依赖 tzdata，本地也能验证。
          stamp="$(TZ=CST-8 date +%Y.%m.%d)"
          echo "stamp=$stamp" >>"$GITHUB_OUTPUT"

          # 当天第几次构建：数已有的 snapshot-<日期>.<N> tag，取最大 N 加一。
          # 用 tag 而不是 Actions API —— tag 才是「已发布」的真实凭据，
          # 失败或没走到发版步骤的构建不会占号，也不需要额外的 API 权限。
          # 查询失败必须硬失败：静默当成 0 会让每次构建都算成 .1，然后互相覆盖。
          if ! raw="$(git ls-remote --tags origin "refs/tags/snapshot-${stamp}.*")"; then
            echo "::error::查询已有 snapshot tag 失败，无法确定构建流水号"
            exit 1
          fi
          last="$(printf '%s\n' "$raw" | grep -v '\^{}' | awk -F. '{print $NF}' \
                  | grep -E '^[0-9]+$' | sort -n | tail -1)"
          seq=$(( ${last:-0} + 1 ))
          version="${stamp}.${seq}"

          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "本次构建版本：${version}"

      # 标准 runner 的根分区只有 70GB 左右，预装的一堆 SDK 一次都用不上
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /opt/az /usr/lib/jvm /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: 恢复 dl 源码包缓存
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: work/openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.DL_CACHE_EPOCH }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        with:
          path: work/openwrt/.ccache
          # run_attempt 必须带上：Re-run 时 run_id 不变，只用 run_id 会撞「key 已存在」
          key: openwrt-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openwrt-ccache-${{ runner.os }}-

      # 步骤级超时是关键：作业级超时会让 GitHub 直接取消整个作业，
      # 后面的存缓存、传日志一个都不执行，几小时攒的 ccache 全丢。
      - name: 构建固件
        timeout-minutes: 300
        env:
          OPENWRT_REF: ${{ steps.meta.outputs.ref }}
          JOBS: ${{ inputs.jobs }}
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
        run: ./build-openwrt.sh

      - name: 停止残留编译进程并检查缓存目录
        if: always()
        id: guard
        run: |
          set -uo pipefail
          # 超时杀掉的是 shell，make 的子进程可能还在写 .ccache，
          # 紧接着上传缓存就会撞上 "file changed as we read it" 直接失败。
          pkill -f "$GITHUB_WORKSPACE/work/openwrt" 2>/dev/null || true
          for _ in 1 2 3 4 5; do
            pgrep -f "$GITHUB_WORKSPACE/work/openwrt" >/dev/null 2>&1 || break
            sleep 2
          done

          mkdir -p work/openwrt/.ccache

          if [ -f work/openwrt/.dl-complete ] && [ -n "$(ls -A work/openwrt/dl 2>/dev/null)" ]; then
            echo "dl_ok=true" >>"$GITHUB_OUTPUT"
            du -sh work/openwrt/dl || true
          else
            echo "dl_ok=false" >>"$GITHUB_OUTPUT"
            echo "::notice::dl/ 不完整（缺 .dl-complete），跳过保存，避免毒化固定 key"
          fi

          if [ -n "$(ls -A work/openwrt/.ccache 2>/dev/null)" ]; then
            echo "ccache_ok=true" >>"$GITHUB_OUTPUT"
            du -sh work/openwrt/.ccache || true
          else
            echo "ccache_ok=false" >>"$GITHUB_OUTPUT"
            echo "::warning::ccache 目录是空的，CONFIG_CCACHE 没生效"
          fi

      - name: 保存 dl 源码包缓存
        if: always() && steps.guard.outputs.dl_ok == 'true' && steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.DL_CACHE_EPOCH }}

      - name: 保存 ccache
        if: always() && steps.guard.outputs.ccache_ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: work/openwrt/.ccache
          key: openwrt-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ steps.meta.outputs.version }}
          path: |
            output/*.img.gz
            output/*rootfs.tar.gz
            output/sha256sums
            output/*.manifest
            output/config.full
            output/config.diff
            output/feeds.lock
            output/build-info.txt
          retention-days: 30
          if-no-files-found: warn

      - name: 上传编译日志（失败时）
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.meta.outputs.version }}-${{ github.run_attempt }}
          path: work/build-logs/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: 写入构建摘要
        if: always()
        run: |
          {
            echo "## OpenWrt x86_64 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 构建版本 | \`${{ steps.meta.outputs.version }}\` |"
            echo "| 源码 ref | \`${{ steps.meta.outputs.ref }}\` |"
            echo "| 提交 | \`$(git -C work/openwrt rev-parse --short HEAD 2>/dev/null || echo n/a)\` |"
            echo "| 并行度 | \`${{ inputs.jobs || 'auto' }}\` |"
            echo "| dl 缓存 | ${{ steps.guard.outputs.dl_ok || 'n/a' }} |"
            echo "| ccache | ${{ steps.guard.outputs.ccache_ok || 'n/a' }} |"
            echo ""
            if [ -f output/build-info.txt ]; then
              echo '```'
              cat output/build-info.txt
              echo '```'
            fi
            if [ -f output/sha256sums ]; then
              echo ""
              echo '```'
              cat output/sha256sums
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # 日常构建（push main / 手动触发 / 定时）成功后，发一份带流水号的快照 Release。
      # tag 是 snapshot-<日期>.<当天第几次>，每次构建各留一份，历史版本都能下载。
      # ref_type != 'tag' 用表达式而不是 !startsWith(...)：YAML 里裸 `!` 开头会被当成 tag 解析。
      - name: 发布构建快照 Release
        if: success() && github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ steps.meta.outputs.version }}
          name: 构建快照 ${{ steps.meta.outputs.version }}
          prerelease: true
          # 并发算出同一个号时互相覆盖，而不是报 already_exists
          overwrite_files: true
          body: |
            > 每次成功构建各留一份，tag 里的最后一段是「当天第几次构建」。
            > 需要长期固定的版本请打 `fw-v*` tag 发正式 Release。

            | 项 | 值 |
            | --- | --- |
            | 构建版本 | `${{ steps.meta.outputs.version }}` |
            | 构建日期 | ${{ steps.meta.outputs.stamp }}（北京时间） |
            | OpenWrt 源码 | `${{ steps.meta.outputs.ref }}` |
            | 构建提交 | `${{ github.sha }}` |
            | 运行记录 | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            刷机选 `*-combined-efi.img.gz`（UEFI 启动，Hyper-V 用第 2 代 + 关安全启动）；
            `*-combined.img.gz` 是传统 BIOS 引导。版本号与哈希见 `build-info.txt`、`sha256sums`。

            刷完可以在路由器上 `cat /etc/dreamopenwrt-version` 核对是不是这个版本。
          files: |
            output/*.img.gz
            output/*rootfs.tar.gz
            output/sha256sums
            output/*.manifest
            output/config.full
            output/config.diff
            output/feeds.lock
            output/build-info.txt

      # 打 fw-v* tag 时发正式 Release，自动生成变更说明。
      - name: 发布正式 Release
        if: startsWith(github.ref, 'refs/tags/fw-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            output/*.img.gz
            output/*rootfs.tar.gz
            output/sha256sums
            output/*.manifest
            output/config.full
            output/config.diff
            output/feeds.lock
            output/build-info.txt

      # 构建完再清一次：前面那一轮清的时候本次运行还是 in_progress、不在可删列表里，
      # 现在它已经算「已完成」了，再删一轮才能把总数压回 8 条。
      # 用 always() 保证构建失败时也会清。
      - name: 清理旧运行记录（构建完成后）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: '8'
        run: ./scripts/cleanup-runs.sh
