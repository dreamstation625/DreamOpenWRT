# DreamOpenWRT 软件源
#
# 官方 feed 跟随 25.12 分支；三方 feed 用 ^commit 锁死，
# 保证同一个 ref 每次构建出来的固件内容一致，出问题也能定位到具体上游提交。
#
# 升级三方上游：./build-openwrt.sh --update-pins

src-git packages https://github.com/openwrt/packages.git;openwrt-25.12
src-git luci https://github.com/openwrt/luci.git;openwrt-25.12
src-git routing https://github.com/openwrt/routing.git;openwrt-25.12

# OpenClash（代理客户端 + LuCI）
src-git openclash https://github.com/vernesong/OpenClash.git^e553e82e01c697aefbe1555261a503f425e00ccd

# 磁盘管理
src-git diskman https://github.com/lisaac/luci-app-diskman.git^c20df1d4f40d86e32fd919f33122b2a48f8a99b4

# 高级设置
src-git advancedplus https://github.com/sirpdboy/luci-app-advancedplus.git^aba81aa40e0f9aa1f1c5a69ee66a7a943a5f6384

# 系统控制
src-git syscontrol https://github.com/bobbyunknown/luci-app-syscontrol.git^6bf93c124a632b2c865aa0db8e3af3af3fd5cfba

# MosDNS（DNS 分流）
src-git mosdns https://github.com/sbwml/luci-app-mosdns.git^dbdd91ab8ac8b079b6a3ca1a48d99e970d17111b
