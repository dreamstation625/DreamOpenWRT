# sysupgrade 时额外保留的文件（会由 find 展开，可以写目录）。
# 两条来源：/etc/sysupgrade.conf + /lib/upgrade/keep.d/*，都是无条件保留。
# /etc/config/ 整个目录已在 keep.d/base-files 里，不用在这里列。
#
# /etc/firewall.user 是 LuCI「防火墙 → 自定义规则」页面的落盘位置，
# 它不属于任何包、也不在 conffiles 里，不列出来升级后自定义规则就没了。
/etc/firewall.user

# 默认值脚本用来区分「全新刷机」和「升级后重跑」的标记（空文件）。
# 不保留它，升级后会误判成首次刷机，把用户改过的主题/语言重写掉。
/etc/.dream-defaults-applied

# AdGuardHome 的主配置。/etc/config/AdGuardHome 只是 LuCI 那个壳，
# 真正的 DNS 上游、过滤订阅、客户端列表都在 configpath 指向的 yaml 里。
# 只有几 KB，保留它就能让升级后 DNS 行为不变。
/etc/AdGuardHome.yaml
#
# ⚠ 不要加 /usr/bin/AdGuardHome/data/：里面是过滤列表缓存和统计库，几十 MB 起。
# x86 的 platform_copy_config 是把 sysupgrade.tgz 拷到 16MB 的 boot 分区，
# 备份包一大就直接写不下，整包配置全丢。统计历史和缓存重建即可，不值得冒这个险。

# 用户自己 apk add 装的包清单（纯文本，几 KB），由
# /lib/upgrade/dream-extra-packages.sh 在生成备份时现场写入，
# 升级后 /etc/init.d/dream-restore-packages 自动重装。
# 这里也列一份，手动 sysupgrade -b 或从老固件过渡时同样带得上。
/etc/dream-extra-packages
